# Test-only overrides. Spring Security is on the test classpath (it is an
# optional dep in the library) — excluding here so its default chain does not
# 401 every MockMvc request.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Explicit library baseline so each test starts from a known state and only
# overrides what it needs (via @TestPropertySource) to exercise a scenario.
rate-limiter.enabled=true
rate-limiter.enable-ip-filtering=true
rate-limiter.ddos-protection-enabled=false
rate-limiter.user-based-limiting-enabled=false
rate-limiter.api-key-based-limiting-enabled=false
